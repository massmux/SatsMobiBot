version: "3.3"

services:
    satsmobi:
        container_name: satsmobi
        hostname: satsmobi
        image: massmux/satsmobi:nl0.1
        restart: on-failure
        volumes:
          - ${PWD}/data:/opt/SatsMobiBot/data
          - ${PWD}/config.yaml:/opt/SatsMobiBot/config.yaml
        working_dir: /opt/SatsMobiBot
        entrypoint: /opt/SatsMobiBot/SatsMobiBot
        environment:
          - TZ=Europe/Rome
          - BOT_WEBHOOK_PORT=5588
          - ENCRYPTION_KEY=${ENCRYPTION_KEY} # 64-char hex string (32 bytes)
        ports:
          - 5454:5454
          - 5588:5588
          - 6060:6060

