*Economia*
_Questo è un wallet Bitcoin Lightning opensource self-custodial. Ci sono 2 saldi: Hot e Safe. Viene usata la lib Breez. Fai il backup del tuo mnemonic subito dopo /start._

*Wallet Lightning*
_Il tuo saldo Safe può essere usato per inviare e ricevere fondi sulla rete Lightning in modo self-custodial, dove possiedi le tue chiavi. Puoi anche scambiare da Hot a Safe quando vuoi. Il saldo Hot può essere usato per mance veloci e piccole su Telegram. Fai subito il backup del seed._

*Open Source*
_Questo Bot è software libero e opensource. Puoi eseguirlo sul tuo computer e usarlo nella tua community. È uno strumento destinato solo a scopi educativi._

*Telegram*
_Aggiungi questo Bot alla tua chat di gruppo Telegram per fare /tip ai post. Se rendi il bot admin del gruppo, puliràanche i comandi per mantenere la chat ordinata._

*Termini di Servizio*
_Fai subito il backup delle tue chiavi con il comando /backup, subito dopo /start. Non possiamo aiutare nel recupero delle chiavi in caso di uso improprio. Questo Bot è in sviluppo beta e sperimentale. Usalo a tuo rischio e pericolo. Gli swap sono soggetti a commissioni dovute alla libreria Breez Nodeless utilizzata in questo strumento._

