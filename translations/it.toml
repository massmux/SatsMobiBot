# HELP

helpMessage = """⚡️ *SatsMobi*
_Questo è un Wallet Suite Bitcoin Lightning opensource self-custodial. Ci sono 2 Saldi: Hot e Safer. Viene utilizzata la libreria Breez. Esegui il backup del tuo mnemonic dopo /start. Usa /basics per i Termini di Servizio._

👉 *Comandi base* (Hot/Safer)
*/tip*: Rispondi a un messaggio per inviare una mancia (Hot): `/tip <importo> [<memo>]`
*/balance*: Controlla il tuo saldo (Hot|Safer): `/balance`
*/send*: Invia mance a un utente (Hot): `/send <importo> @utente o utente@sats.mobi [<memo>]`
*/invoice*: Ricevi (Safer): `/invoice <importo> [<memo>]`
*/pay*: Paga una fattura (Safer): `/pay <fattura>`
*/rate*: Controlla i tassi di cambio: `/rate [importo] [valuta]` - Esempio: `/rate 10000 USD`
*/cashback*: QRCODE per ricevere cashback.
*/activatecard*: Richiedi l'attivazione di una NFC Card SatsMobi `/activatecard <CardID>`

👉 *Comandi inline*
*send*: Invia sats in chat: `@%s send <importo> [<utente>] [<memo>]`
*receive*: Richiedi un pagamento: `... receive <importo> [<utente>] [<memo>]`
*faucet*: Crea un faucet: `... faucet <capacità> <per_utente> [<memo>]`
*tipjar*: Crea un tipjar: `... tipjar <capacità> <per_utente> [<memo>]`

📖 Puoi usare i comandi inline in qualsiasi chat, anche nelle conversazioni private. Aspetta un secondo dopo aver inserito un comando inline e *clicca* il risultato, non premere invio.

👉 *Comandi avanzati* (Hot/Safer)
*/transactions*: Lista delle transazioni
*/link*: Collega Hot a Bluewallet o Zeus
*/lnurl*: Ricevi o paga via Lnurl (Hot): `/lnurl` oppure `/lnurl <lnurl> [memo]`
*/nostr*: Connettiti a Nostr: `/nostr` prima volta: `/nostr help`
*/pos*: Attiva il tuo POS (Hot): `/pos`
*/group*: Funzionalità chat di gruppo (Hot): `/group`
*/shop*: Sfoglia i negozi: `/shop` oppure `/shop <utente/shop_id>`
*/backup*: Backup della tua Seedphrase Safer: `/backup`
*/buybtc*: Acquista Bitcoin con Moonpay: `/buybtc`
*/swaptosafe*: Sposta TUTTI i fondi da Hot a Safer: `/swaptosafe`
*/swapall*: Alias per spostare tutto da Hot a Safer: `/swapall`
*/swaptohot*: Riempi Hot con Safer fino al limite: `/swaptohot`
*/help*: Leggi questo aiuto.
"""
