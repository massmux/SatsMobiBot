# HELP

helpMessage = """⚡️ *SatsMobi*
_Questo è un wallet Bitcoin Lightning opensource self-custodial. Ci sono 2 saldi: Hot e Safe. Viene usata la libreria Breez. Fai il backup del tuo mnemonic subito dopo /start. Usa /basics per i Termini di Servizio._

👉 *Comandi base* (Hot/Safe)
*/tip*: Rispondi a un messaggio per inviare una mancia (Hot): `/tip <importo> [<memo>]`
*/balance*: Controlla il tuo saldo (Hot|Safe): `/balance`
*/send*: Invia sats a un utente (Hot): `/send <importo> @utente o utente@sats.mobi [<memo>]`
*/invoice*: Ricevi (Safe): `/invoice <importo> [<memo>]`
*/pay*: Paga una fattura (Safe): `/pay <fattura>`
*/rate*: Controlla i tassi di cambio: `/rate [importo] [valuta]` - Esempio: `/rate 10000 USD`
*/cashback*: QRCODE per ricevere cashback.
*/activatecard*: Richiedi l'attivazione di una NFC Card SatsMobi `/activatecard <CardID>`

👉 *Comandi inline*
*send*: Invia sats in chat: `@%s send <importo> [<utente>] [<memo>]`
*receive*: Richiedi un pagamento: `... receive <importo> [<utente>] [<memo>]`
*faucet*: Crea un faucet: `... faucet <capacità> <per_utente> [<memo>]`
*tipjar*: Crea un tipjar: `... tipjar <capacità> <per_utente> [<memo>]`

📖 Puoi usare i comandi inline in qualsiasi chat, anche nelle conversazioni private. Aspetta un secondo dopo aver inserito un comando inline e *clicca* sul risultato, non premere invio.

👉 *Comandi avanzati* (Hot/Safe)
*/transactions*: Lista transazioni
*/link*: Collega Hot a Bluewallet o Zeus
*/lnurl*: Lnurl ricevi o paga (Hot): `/lnurl` oppure `/lnurl <lnurl> [memo]`
*/nostr*: Connettiti a Nostr: `/nostr` prima volta: `/nostr help`
*/pos*: Prepara il tuo POS (Hot): `/pos`
*/group*: Funzioni chat di gruppo (Hot): `/group`
*/shop*: Sfoglia i negozi: `/shop` oppure `/shop <utente/shop_id>`
*/backup*: Backup del tuo Seed Safe: `/backup`
*/buybtc*: Compra Bitcoin con Moonpay: `/buybtc`
*/swaptosafe*: Sposta TUTTI i fondi da Hot a Safe: `/swaptosafe`
*/swapall*: Alias per spostare tutto da Hot a Safe: `/swapall`
*/swaptohot*: Ricarica Hot da Safe fino al limite: `/swaptohot`
*/help*: Leggi questo aiuto.
"""
