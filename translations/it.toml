basicsMessage = """
*Economia*
_Questo è un portafoglio Bitcoin Lightning opensource auto-custodiale. Ci sono 2 Saldi: Hot e Safe. Viene utilizzata la libreria Breez. Esegui il backup del tuo mnemonic dopo /start._

*Portafogli Lightning*
_Il tuo saldo Safe può essere utilizzato per inviare e ricevere fondi sulla rete Lightning in modo auto-custodiale, dove possiedi le tue chiavi. Puoi anche scambiare da Hot a Safe quando vuoi. Il saldo Hot può essere utilizzato per mance veloci e piccole su Telegram. Esegui immediatamente il backup della frase seed_.

*Open Source*
_Questo Bot è software libero e opensource. Puoi eseguirlo sul tuo computer e usarlo nella tua comunità. È uno strumento destinato solo a scopi educativi._

*Telegram*
_Aggiungi questo Bot alla tua chat di gruppo Telegram per dare /mance ai post. Se rendi il bot amministratore del gruppo, pulirà anche i comandi per mantenere la chat ordinata._

*Termini di Servizio*
_Backup immediato delle tue chiavi con il comando /backup, subito dopo /start. Non possiamo aiutare a recuperare le chiavi in caso di uso improprio. Questo Bot è in fase di sviluppo beta ed è sperimentale. Usa a tuo rischio. Gli scambi sono soggetti a commissioni di scambio dovute alla libreria Breez Nodeless utilizzata in questo strumento._

_Cittadini e residenti degli Stati Uniti e di qualsiasi paese sanzionato dalla SECO sono proibiti dall'utilizzare questo servizio. Proseguendo, confermi e dichiari di NON essere cittadino degli Stati Uniti o di qualsiasi paese sanzionato dalla SECO._

Informazioni sulle commissioni di scambio Breez: [Commissioni Breez](https://sdk-doc-liquid.breez.technology/guide/base_fees.html)
