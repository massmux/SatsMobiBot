*Economia*
_Questo è un Wallet Suite Bitcoin Lightning opensource self-custodial (si applicano le limitazioni di Telegram e Breez). Ci sono 2 Saldi: Hot e Safer. Viene usata la libreria Breez. Esegui il backup del tuo mnemonic dopo /start. Fai le tue ricerche e usa solo piccoli importi, questo è software in beta e può essere insicuro._

*Wallet Lightning*
_Il tuo Saldo Safer può essere usato per inviare e ricevere fondi sulla rete Lightning in modo tale che tu possieda le tue chiavi. Puoi anche scambiare da Hot a Saldo Safer quando vuoi. Il saldo Hot può essere usato per mance veloci e piccole su Telegram. Esegui subito il backup della seedphrase_.

*Open Source*
_Questo Bot è software libero e opensource. Puoi eseguirlo sul tuo computer e usarlo nella tua comunità. È uno strumento destinato esclusivamente a scopi educativi._

*Telegram*
_Aggiungi questo Bot alla tua chat di gruppo Telegram per inviare /tip ai post. Se rendi il bot amministratore del gruppo, eliminerà anche i comandi per mantenere la chat in ordine._

*Termini di Servizio*
_Esegui immediatamente il backup delle tue chiavi con il comando /backup, subito dopo /start. Non possiamo aiutare nel recupero delle chiavi in caso di uso improprio. Questo Bot è in sviluppo beta e sperimentale. Usalo a tuo rischio. Gli Swap sono soggetti a commissioni di Swap dovute alla libreria Breez Nodeless utilizzata in questo strumento. Non usare più di piccoli importi. Tieni conto delle limitazioni note dovute all'uso di Telegram e della libreria Breez._

_I cittadini e i residenti degli Stati Uniti e dei paesi sanzionati dalla SECO non possono utilizzare questo servizio. Continuando, confermi e dichiari di NON essere cittadino degli Stati Uniti o di alcun paese sanzionato dalla SECO._

Informazioni sulle commissioni di Swap Breez: [Commissioni Breez](https://sdk-doc-liquid.breez.technology/guide/base_fees.html)
"""

