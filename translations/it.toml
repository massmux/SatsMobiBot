helpMessage = """⚡️ *SatsMobi*
_Questo è un portafoglio Bitcoin Lightning opensource auto-custodiale. Ci sono 2 Saldi: Hot e Safe. Viene utilizzata la libreria Breez. Esegui prima il backup del tuo mnemonic dopo /start. Premi /basi per i TOS._

👉 *Comandi base* (Hot/Safe)
*/mancia*: Rispondi a un messaggio per dare una mancia (Hot): `/mancia <importo> [<nota>]`
*/saldo*: Controlla il tuo saldo (Hot|Safe): `/saldo`
*/invia*: Invia mance a un utente (Hot): `/invia <importo> @utente o utente@sats.mobi [<nota>]`
*/fattura*: Ricevi (Safe): `/fattura <importo> [<nota>]`
*/paga*: Paga Fattura (Safe): `/paga <fattura>`
*/rate*: Controlla i tassi di cambio: `/rate [importo] [valuta]` - Esempio: `/rate 10000 USD`
*/cashback*: CODICE QR per ricevere cashback.
*/activatecard*: Richiedi attivazione di una carta NFC SatsMobi `/activatecard <CardID>`

👉 *Comandi inline*
*invia*: Invia sats alla chat: `@%s invia <importo> [<utente>] [<nota>]`
*ricevi*: Richiedi un pagamento: `... ricevi <importo> [<utente>] [<nota>]`
*rubinetto*: Crea un rubinetto: `... rubinetto <capacità> <per_utente> [<nota>]`
*barattolo*: Crea un barattolo delle mance: `... barattolo <capacità> <per_utente> [<nota>]`

📖 Puoi usare i comandi inline in ogni chat, anche nelle conversazioni private. Aspetta un secondo dopo aver inserito un comando inline e *clicca* il risultato, non premere invio.

👉 *Comandi avanzati* (Hot/Safe)
*/transazioni*: Lista delle transazioni
*/collega*: Collega Hot a Bluewallet o Zeus
*/lnurl*: Ricevi o paga Lnurl (Hot): `/lnurl` o `/lnurl <lnurl> [nota]`
*/nostr*: Connettiti a Nostr: `/nostr` prima volta: `/nostr aiuto`
*/pos*: Prepara il tuo POS (Hot): `/pos`
*/group*: Funzionalità chat di gruppo (Hot): `/group`
*/shop*: Sfoglia i negozi: `/shop` o `/shop <utente/shop_id>`
*/backup*: Backup della tua frase seed Safe: `/backup`
*/buybtc*: Compra Bitcoin con Moonpay: `/buybtc`
*/swaptosafe*: Scambia TUTTI i fondi da Hot a Safe: `/swaptosafe`
*/swapall*: Alias per scambiare tutto da Hot a Safe: `/swapall`
*/swaptohot*: Riempi Hot con Safe fino al limite: `/swaptohot`
*/aiuto*: Leggi questo aiuto.
