basicsMessage = """
*Economía*
_Esta es una suite de carteras Bitcoin Lightning opensource self-custodial (se aplican limitaciones de Telegram y Breez). Hay 2 Saldos: Hot y Safer. Se usa la librería Breez. Haz copia de seguridad de tu mnémónico después de /start. Investiga por tu cuenta y usa solo pequeñas cantidades, este es software en beta y puede ser inseguro._

*Carteras Lightning*
_Tu Saldo Safer puede usarse para enviar y recibir fondos en la red Lightning de forma que poseas tus propias claves. También puedes intercambiar de Hot a Saldo Safer cuando quieras. El saldo Hot puede usarse para propinas rápidas y pequeñas en Telegram. Haz inmediatamente la copia de seguridad de la seedphrase_.

*Open Source*
_Este Bot es software libre y opensource. Puedes ejecutarlo en tu propio ordenador y usarlo en tu comunidad. Es una herramienta destinada únicamente con fines educativos._

*Telegram*
_Añade este Bot a tu chat de grupo de Telegram para enviar /tip a los mensajes. Si haces al bot administrador del grupo, también eliminará los comandos para mantener el chat ordenado._

*Términos de Servicio*
_Haz inmediatamente una copia de seguridad de tus claves con el comando /backup, justo después de /start. No podemos ayudar a recuperar las claves en caso de uso indebido. Este Bot está en desarrollo beta y es experimental. Úsalo bajo tu propio riesgo. Los intercambios están sujetos a comisiones de swap debidas a la librería Breez Nodeless utilizada en esta herramienta. No uses más que pequeñas cantidades. Ten en cuenta las limitaciones conocidas por el uso de Telegram y la librería Breez._

_Los ciudadanos y residentes de los Estados Unidos y cualquier país sancionado por la SECO tienen prohibido usar este servicio. Al continuar, confirmas y declaras que NO eres ciudadano de los Estados Unidos ni de ningún país sancionado por la SECO._

Acerca de las comisiones de Swap Breez: [Comisiones Breez](https://sdk-doc-liquid.breez.technology/guide/base_fees.html)
"""

