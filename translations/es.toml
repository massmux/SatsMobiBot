basicsMessage = """
*Economía*
_Esta es una suite de cartera Bitcoin Lightning de código abierto y autocustodia. Hay 2 saldos: Hot y Safe. Se utiliza la lib Breez. Haz una copia de seguridad de tu mnemónico después de /start._

*Carteras Lightning*
_Tu saldo Safe puede usarse para enviar y recibir fondos en la red Lightning de forma autocustodia, donde posees tus claves. También puedes intercambiar de Hot a Safe cuando quieras. El saldo Hot puede usarse para propinas rápidas y pequeñas en Telegram. Haz una copia de seguridad de la frase semilla inmediatamente._

*Código Abierto*
_Este Bot es software libre y de código abierto. Puedes ejecutarlo en tu propio ordenador y usarlo en tu propia comunidad. Es una herramienta destinada solo con fines educativos._

*Telegram*
_Añade este Bot a tu chat de grupo de Telegram para dar /tip a los mensajes. Si haces al bot administrador del grupo, también limpiará los comandos para mantener el chat ordenado._

*Términos de Servicio*
_Haz una copia de seguridad inmediata de tus claves con el comando /backup, justo después de /start. No podemos ayudar a recuperar las claves en caso de uso indebido. Este Bot está en desarrollo beta y es experimental. Úsalo bajo tu propio riesgo. Los swaps están sujetos a comisiones de swap debido a la biblioteca Breez Nodeless utilizada en esta herramienta._

_Los ciudadanos y residentes de los Estados Unidos y cualquier país sancionado por la SECO tienen prohibido usar este servicio. Al continuar, confirmas y declaras que NO eres ciudadano de los Estados Unidos o de ningún país sancionado por la SECO._

