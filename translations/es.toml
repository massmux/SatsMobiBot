basicsMessage = """
*Economía*
_Esta es una suite de carteras Bitcoin Lightning de código abierto auto-custodiadas. Hay 2 Saldos: Hot y Safe. Se utiliza la biblioteca Breez. Haz copia de seguridad de tu mnemónico después de /start._

*Carteras Lightning*
_Tu saldo Safe puede usarse para enviar y recibir fondos en la red Lightning de manera auto-custodiada, donde posees tus claves. También puedes intercambiar de Hot a Safe cuando quieras. El saldo Hot puede usarse para propinas rápidas y pequeñas en Telegram. Haz copia de seguridad inmediatamente de la frase semilla_.

*Código Abierto*
_Este Bot es software libre y de código abierto. Puedes ejecutarlo en tu propia computadora y usarlo en tu propia comunidad. Es una herramienta destinada solo a fines educativos._

*Telegram*
_Agrega este Bot a tu chat de grupo de Telegram para dar /propinas a las publicaciones. Si haces al bot administrador del grupo, también limpiará los comandos para mantener el chat ordenado._

*Términos de Servicio*
_Copia de seguridad inmediata de tus claves con el comando /backup, justo después de /start. No podemos ayudar a recuperar las claves en caso de uso indebido. Este Bot está en desarrollo beta y es experimental. Úsalo bajo tu propio riesgo. Los intercambios están sujetos a comisiones de intercambio debido a la biblioteca Breez Nodeless utilizada en esta herramienta._

_Los ciudadanos y residentes de los Estados Unidos y cualquier país sancionado por la SECO tienen prohibido usar este servicio. Al continuar, confirmas y declaras que NO eres ciudadano de los Estados Unidos o cualquier país sancionado por la SECO._

