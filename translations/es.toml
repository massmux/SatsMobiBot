helpMessage = """⚡️ *SatsMobi*
_Esta es una suite de carteras Bitcoin Lightning de código abierto auto-custodiadas. Hay 2 Saldos: Hot y Safe. Se utiliza la biblioteca Breez. Haz copia de seguridad de tu mnemónico primero después de /start. Pulsa /basicos para los TOS._

👉 *Comandos básicos* (Hot/Safe)
*/propina*: Responde a un mensaje para dar propina (Hot): `/propina <cantidad> [<nota>]`
*/saldo*: Verifica tu saldo (Hot|Safe): `/saldo`
*/enviar*: Envía propinas a un usuario (Hot): `/enviar <cantidad> @usuario o usuario@sats.mobi [<nota>]`
*/factura*: Recibir (Safe): `/factura <cantidad> [<nota>]`
*/pagar*: Pagar Factura (Safe): `/pagar <factura>`
*/rate*: Verificar tipos de cambio: `/rate [cantidad] [moneda]` - Ejemplo: `/rate 10000 USD`
*/cashback*: CÓDIGO QR para recibir cashback.
*/activatecard*: Solicitar activación de una tarjeta NFC SatsMobi `/activatecard <CardID>`

👉 *Comandos inline*
*enviar*: Enviar sats al chat: `@%s enviar <cantidad> [<usuario>] [<nota>]`
*recibir*: Solicitar un pago: `... recibir <cantidad> [<usuario>] [<nota>]`
*grifo*: Crear un grifo: `... grifo <capacidad> <por_usuario> [<nota>]`
*bote*: Crear un bote de propinas: `... bote <capacidad> <por_usuario> [<nota>]`

📖 Puedes usar comandos inline en cualquier chat, incluso en conversaciones privadas. Espera un segundo después de ingresar un comando inline y *haz clic* en el resultado, no presiones enter.

👉 *Comandos avanzados* (Hot/Safe)
*/transacciones*: Lista de transacciones
*/enlazar*: Enlazar Hot a Bluewallet o Zeus
*/lnurl*: Recibir o pagar con Lnurl (Hot): `/lnurl` o `/lnurl <lnurl> [nota]`
*/nostr*: Conectar a Nostr: `/nostr` primera vez: `/nostr ayuda`
*/pos*: Prepara tu POS (Hot): `/pos`
*/group*: Funciones de chat de grupo (Hot): `/group`
*/shop*: Explorar tiendas: `/shop` o `/shop <usuario/shop_id>`
