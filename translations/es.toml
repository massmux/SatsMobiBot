# HELP

helpMessage = """⚡️ *SatsMobi*
_Esta es una suite de carteras Bitcoin Lightning opensource self-custodial. Hay 2 Saldos: Hot y Safer. Se utiliza la librería Breez. Haz una copia de seguridad de tu mnémónico después de /start. Usa /basics para los TdS._

👉 *Comandos básicos* (Hot/Safer)
*/tip*: Responde a un mensaje para dar propina (Hot): `/tip <cantidad> [<memo>]`
*/balance*: Comprueba tu saldo (Hot|Safer): `/balance`
*/send*: Envía propinas a un usuario (Hot): `/send <cantidad> @usuario o usuario@sats.mobi [<memo>]`
*/invoice*: Recibir (Safer): `/invoice <cantidad> [<memo>]`
*/pay*: Pagar factura (Safer): `/pay <factura>`
*/payln*: Pagar factura (Hot): `/payln <factura>`
*/rate*: Consulta tipos de cambio: `/rate [cantidad] [moneda]` - Ejemplo: `/rate 10000 USD`
*/cashback*: QRCODE para recibir cashback.
*/activatecard*: Solicita la activación de una NFC Card SatsMobi `/activatecard <CardID>`

👉 *Comandos inline*
*send*: Enviar sats al chat: `@%s send <cantidad> [<usuario>] [<memo>]`
*receive*: Solicitar un pago: `... receive <cantidad> [<usuario>] [<memo>]`
*faucet*: Crear un faucet: `... faucet <capacidad> <por_usuario> [<memo>]`
*tipjar*: Crear un tipjar: `... tipjar <capacidad> <por_usuario> [<memo>]`

📖 Puedes usar comandos inline en cualquier chat, incluso en conversaciones privadas. Espera un segundo después de introducir un comando inline y *haz clic* en el resultado, no pulses intro.

👉 *Comandos avanzados* (Hot/Safer)
*/transactions*: Lista de transacciones
*/link*: Vincular Hot a Bluewallet o Zeus
*/lnurl*: Recibir o pagar mediante Lnurl (Hot): `/lnurl` o `/lnurl <lnurl> [memo]`
*/nostr*: Conectar con Nostr: `/nostr` primera vez: `/nostr help`
*/pos*: Prepara tu POS (Hot): `/pos`
*/group*: Funciones de chat de grupo (Hot): `/group`
*/shop*: Explorar tiendas: `/shop` o `/shop <usuario/shop_id>`
*/backup*: Copia de seguridad de tu Seedphrase Safer: `/backup`
*/buybtc*: Compra Bitcoin con Moonpay: `/buybtc`
*/swaptosafe*: Intercambiar TODOS los fondos de Hot a Safer: `/swaptosafe`
*/swapall*: Alias para intercambiar todo de Hot a Safer: `/swapall`
*/swaptohot*: Llenar Hot con Safer hasta el límite: `/swaptohot`
*/help*: Leer esta ayuda.
"""
