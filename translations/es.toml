# HELP

helpMessage = """⚡️ *SatsMobi*
_Esta es una suite de cartera Bitcoin Lightning de código abierto y autocustodia. Hay 2 saldos: Hot y Safe. Se utiliza la biblioteca Breez. Haz una copia de seguridad de tu mnemónico después de /start. Usa /basics para los Términos de Servicio._

👉 *Comandos básicos* (Hot/Safe)
*/tip*: Responde a un mensaje para dar propina (Hot): `/tip <cantidad> [<memo>]`
*/balance*: Revisa tu saldo (Hot|Safe): `/balance`
*/send*: Envía sats a un usuario (Hot): `/send <cantidad> @usuario o usuario@sats.mobi [<memo>]`
*/invoice*: Recibir (Safe): `/invoice <cantidad> [<memo>]`
*/pay*: Pagar factura (Safe): `/pay <factura>`
*/rate*: Verificar tipos de cambio: `/rate [cantidad] [moneda]` - Ejemplo: `/rate 10000 USD`
*/cashback*: QRCODE para recibir cashback.
*/activatecard*: Solicitar activación de una NFC Card SatsMobi `/activatecard <CardID>`

👉 *Comandos inline*
*send*: Enviar sats al chat: `@%s send <cantidad> [<usuario>] [<memo>]`
*receive*: Solicitar un pago: `... receive <cantidad> [<usuario>] [<memo>]`
*faucet*: Crear un faucet: `... faucet <capacidad> <por_usuario> [<memo>]`
*tipjar*: Crear un tipjar: `... tipjar <capacidad> <por_usuario> [<memo>]`

📖 Puedes usar comandos inline en cualquier chat, incluso en conversaciones privadas. Espera un segundo después de ingresar un comando inline y *haz clic* en el resultado, no presiones enter.

👉 *Comandos avanzados* (Hot/Safe)
*/transactions*: Lista de transacciones
*/link*: Vincular Hot a Bluewallet o Zeus
*/lnurl*: Lnurl recibir o pagar (Hot): `/lnurl` o `/lnurl <lnurl> [memo]`
*/nostr*: Conectarse a Nostr: `/nostr` primera vez: `/nostr help`
*/pos*: Prepara tu POS (Hot): `/pos`
*/group*: Funciones de chat grupal (Hot): `/group`
*/shop*: Explorar tiendas: `/shop` o `/shop <usuario/shop_id>`
*/backup*: Copia de seguridad de tu Seed Safe: `/backup`
*/buybtc*: Comprar Bitcoin con Moonpay: `/buybtc`
*/swaptosafe*: Mover TODOS los fondos de Hot a Safe: `/swaptosafe`
*/swapall*: Alias para mover todo de Hot a Safe: `/swapall`
*/swaptohot*: Recargar Hot desde Safe hasta el límite: `/swaptohot`
*/help*: Leer esta ayuda.
"""
