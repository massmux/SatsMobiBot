basicsMessage = """
*Wirtschaft*
_Dies ist eine Bitcoin-Lightning-Opensource-Self-Custodial-Wallet-Suite. Es gibt 2 Guthaben: Hot und Safe. Die Breez-Lib wird verwendet. Sichere dein Mnemonic nach /start._

*Lightning-Wallets*
_Dein Safe-Guthaben kann verwendet werden, um Mittel ueber das Lightning-Netzwerk auf self-custodiale Weise zu senden und zu empfangen, wobei du deine Schluessel besitzt. Du kannst auch jederzeit von Hot nach Safe tauschen. Das Hot-Guthaben kann fuer schnelle und kleine Trinkgelder ueber Telegram verwendet werden. Sichere sofort die Seed-Phrase._

*Open Source*
_Dieser Bot ist freie und Open-Source-Software. Du kannst ihn auf deinem eigenen Computer ausfuehren und in deiner eigenen Community verwenden. Es ist ein Werkzeug nur fuer Bildungszwecke._

*Telegram*
_Fuege diesen Bot zu deinem Telegram-Gruppenchat hinzu, um Posts mit /tip zu versehen. Wenn du den Bot zum Admin der Gruppe machst, raumt er auch Befehle auf, um den Chat ordentlich zu halten._

*Nutzungsbedingungen*
_Sichere sofort deine Schluessel mit dem Befehl /backup, direkt nach /start. Wir koennen bei der Wiederherstellung der Schluessel bei Missbrauch nicht helfen. Dieser Bot befindet sich in der Beta-Entwicklung und ist experimentell. Verwende ihn auf eigenes Risiko. Die Swaps unterliegen Swap-Gebuehren aufgrund der in diesem Tool verwendeten Breez-Nodeless-Bibliothek._

_Buerger und Einwohner der Vereinigten Staaten und aller von der SECO sanktionierten Laender duerfen diesen Dienst nicht nutzen. Indem du fortfaehrst, bestaedigst und erklaerst du, dass du KEIN Buerger der Vereinigten Staaten oder eines von der SECO sanktionierten Landes bist._

Ueber Breez-Swap-Gebuehren: [Breez-Gebuehren](https://sdk-doc-liquid.breez.technology/guide/base_fees.html)
"""

