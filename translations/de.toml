# HELP

helpMessage = """⚡️ *SatsMobi*
_Dies ist eine opensource self-custodial Bitcoin Lightning Wallet-Suite. Es gibt 2 Guthaben: Hot und Safer. Die Breez-Bibliothek wird verwendet. Sichere deine Mnemonic nach /start. Nutze /basics fuer die AGB._

👉 *Grundlegende Befehle* (Hot/Safer)
*/tip*: Antworte auf eine Nachricht, um Trinkgeld zu geben (Hot): `/tip <Betrag> [<Memo>]`
*/balance*: Pruefe dein Guthaben (Hot|Safer): `/balance`
*/send*: Sende Trinkgeld an einen Nutzer (Hot): `/send <Betrag> @Nutzer oder Nutzer@sats.mobi [<Memo>]`
*/invoice*: Empfangen (Safer): `/invoice <Betrag> [<Memo>]`
*/pay*: Rechnung bezahlen (Safer): `/pay <Rechnung>`
*/payln*: Rechnung bezahlen (Hot): `/payln <Rechnung>`
*/rate*: Wechselkurse pruefen: `/rate [Betrag] [Waehrung]` - Beispiel: `/rate 10000 USD`
*/cashback*: QRCODE fuer Cashback-Empfang.
*/activatecard*: Aktivierung einer SatsMobi NFC-Karte anfordern `/activatecard <CardID>`

👉 *Inline-Befehle*
*send*: Sats in den Chat senden: `@%s send <Betrag> [<Nutzer>] [<Memo>]`
*receive*: Zahlung anfordern: `... receive <Betrag> [<Nutzer>] [<Memo>]`
*faucet*: Faucet erstellen: `... faucet <Kapazitaet> <pro_Nutzer> [<Memo>]`
*tipjar*: Tipjar erstellen: `... tipjar <Kapazitaet> <pro_Nutzer> [<Memo>]`

📖 Du kannst Inline-Befehle in jedem Chat verwenden, auch in privaten Gespraechen. Warte eine Sekunde nach der Eingabe eines Inline-Befehls und *klicke* auf das Ergebnis, druecke nicht Enter.

👉 *Erweiterte Befehle* (Hot/Safer)
*/transactions*: Transaktionsliste
*/link*: Hot mit Bluewallet oder Zeus verknuepfen
*/lnurl*: Empfangen oder bezahlen per Lnurl (Hot): `/lnurl` oder `/lnurl <lnurl> [Memo]`
*/nostr*: Mit Nostr verbinden: `/nostr` erstes Mal: `/nostr help`
*/pos*: POS vorbereiten (Hot): `/pos`
*/group*: Gruppenchat-Funktionen (Hot): `/group`
*/shop*: Shops durchsuchen: `/shop` oder `/shop <Nutzer/shop_id>`
*/backup*: Safer Seedphrase sichern: `/backup`
*/buybtc*: Bitcoin mit Moonpay kaufen: `/buybtc`
*/swaptosafe*: ALLE Mittel von Hot nach Safer tauschen: `/swaptosafe`
*/swapall*: Alias fuer den Tausch aller Mittel von Hot nach Safer: `/swapall`
*/swaptohot*: Hot mit Safer bis zum Limit fuellen: `/swaptohot`
*/help*: Diese Hilfe lesen.
"""
