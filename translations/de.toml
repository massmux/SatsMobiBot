basicsMessage = """
*Wirtschaft*
_Dies ist eine opensource self-custodial Bitcoin Lightning Wallet-Suite (Einschraenkungen durch Telegram und Breez gelten). Es gibt 2 Guthaben: Hot und Safer. Die Breez-Bibliothek wird verwendet. Sichere deine Mnemonic nach /start. Recherchiere selbst und verwende nur kleine Betraege, dies ist Beta-Software und kann unsicher sein._

*Lightning-Wallets*
_Dein Safer-Guthaben kann genutzt werden, um Mittel im Lightning-Netzwerk zu senden und zu empfangen, wobei du deine Schluessel besitzt. Du kannst auch jederzeit von Hot zum Safer-Guthaben tauschen. Das Hot-Guthaben kann fuer schnelle und kleine Trinkgelder ueber Telegram verwendet werden. Sichere die Seedphrase sofort_.

*Open Source*
_Dieser Bot ist freie und opensource Software. Du kannst ihn auf deinem eigenen Computer ausfuehren und in deiner Gemeinschaft nutzen. Es ist ein Werkzeug, das ausschliesslich fuer Bildungszwecke gedacht ist._

*Telegram*
_Fuege diesen Bot zu deinem Telegram-Gruppenchat hinzu, um Beitraege mit /tip zu versehen. Wenn du den Bot zum Admin der Gruppe machst, rauemt er auch Befehle auf, um den Chat ordentlich zu halten._

*Nutzungsbedingungen*
_Sichere deine Schluessel sofort mit dem /backup-Befehl, direkt nach /start. Wir koennen nicht bei der Wiederherstellung der Schluessel bei Missbrauch helfen. Dieser Bot befindet sich in der Beta-Entwicklung und ist experimentell. Verwendung auf eigene Gefahr. Die Swaps unterliegen Swap-Gebuehren aufgrund der Breez Nodeless-Bibliothek, die in diesem Tool verwendet wird. Verwende nicht mehr als kleine Betraege. Beachte die bekannten Einschraenkungen durch die Nutzung von Telegram und der Breez-Bibliothek._

_Buerger und Einwohner der Vereinigten Staaten und aller von der SECO sanktionierten Laender duerfen diesen Dienst nicht nutzen. Durch das Fortfahren bestaetigst und erklaerst du, dass du KEIN Buerger der Vereinigten Staaten oder eines von der SECO sanktionierten Landes bist._

Ueber Breez-Swap-Gebuehren: [Breez-Gebuehren](https://sdk-doc-liquid.breez.technology/guide/base_fees.html)
"""

