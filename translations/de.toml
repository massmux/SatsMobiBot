basicsMessage = """
*Wirtschaft*
_Dies ist eine Open-Source Self-Custodial Bitcoin Lightning Wallet Suite. Es gibt 2 Guthaben: Hot und Safe. Die Breez-Bibliothek wird verwendet. Sichere deine Mnemonic nach /start._

*Lightning Wallets*
_Dein Safe-Guthaben kann verwendet werden, um Mittel über das Lightning-Netzwerk auf Self-Custodial-Weise zu senden und zu empfangen, wobei du deine Schlüssel besitzt. Du kannst auch jederzeit von Hot zu Safe wechseln. Das Hot-Guthaben kann für schnelles und kleines Trinkgeld über Telegram verwendet werden. Sichere sofort die Seed-Phrase_.

*Open Source*
_Dieser Bot ist freie und Open-Source-Software. Du kannst ihn auf deinem eigenen Computer ausführen und in deiner eigenen Community verwenden. Es ist ein Werkzeug, das nur für Bildungszwecke gedacht ist._

*Telegram*
_Füge diesen Bot zu deiner Telegram-Gruppenchat hinzu, um Beiträge mit /trinkgeld zu versehen. Wenn du den Bot zum Administrator der Gruppe machst, wird er auch Befehle aufräumen, um den Chat ordentlich zu halten._

*Nutzungsbedingungen*
_Sofortige Sicherung deiner Schlüssel mit dem /backup-Befehl, direkt nach /start. Wir können bei der Wiederherstellung der Schlüssel im Falle eines Missbrauchs nicht helfen. Dieser Bot befindet sich in der Beta-Entwicklung und ist experimentell. Nutzung auf eigenes Risiko. Die Swaps unterliegen Swap-Gebühren aufgrund der Breez Nodeless-Bibliothek, die in diesem Tool verwendet wird._

_Bürgern und Einwohnern der Vereinigten Staaten und aller von der SECO sanktionierten Länder ist die Nutzung dieses Dienstes untersagt. Indem du fortfährst, bestätigst und erklärst du, dass du NICHT Bürger der Vereinigten Staaten oder eines von der SECO sanktionierten Landes bist._

Über Breez Swap-Gebühren: [Breez-Gebühren](https://sdk-doc-liquid.breez.technology/guide/base_fees.html)
"""

