# HELP

helpMessage = """⚡️ *SatsMobi*
_Dies ist eine Bitcoin-Lightning-Opensource-Self-Custodial-Wallet-Suite. Es gibt 2 Guthaben: Hot und Safe. Die Breez-Bibliothek wird verwendet. Sichere dein Mnemonic nach /start. Nutze /basics fuer die Nutzungsbedingungen._

👉 *Grundbefehle* (Hot/Safe)
*/tip*: Antworte auf eine Nachricht, um Trinkgeld zu geben (Hot): `/tip <Betrag> [<Memo>]`
*/balance*: Guthaben pruefen (Hot|Safe): `/balance`
*/send*: Sats an einen Nutzer senden (Hot): `/send <Betrag> @Nutzer oder Nutzer@sats.mobi [<Memo>]`
*/invoice*: Empfangen (Safe): `/invoice <Betrag> [<Memo>]`
*/pay*: Rechnung bezahlen (Safe): `/pay <Rechnung>`
*/rate*: Wechselkurse pruefen: `/rate [Betrag] [Waehrung]` - Beispiel: `/rate 10000 USD`
*/cashback*: QRCODE zum Cashback-Empfang.
*/activatecard*: Aktivierung einer SatsMobi NFC-Karte anfordern `/activatecard <CardID>`

👉 *Inline-Befehle*
*send*: Sats im Chat senden: `@%s send <Betrag> [<Nutzer>] [<Memo>]`
*receive*: Zahlung anfordern: `... receive <Betrag> [<Nutzer>] [<Memo>]`
*faucet*: Faucet erstellen: `... faucet <Kapazitaet> <pro_Nutzer> [<Memo>]`
*tipjar*: Tipjar erstellen: `... tipjar <Kapazitaet> <pro_Nutzer> [<Memo>]`

📖 Du kannst Inline-Befehle in jedem Chat verwenden, auch in privaten Gespraechen. Warte eine Sekunde nach der Eingabe eines Inline-Befehls und *klicke* auf das Ergebnis, druecke nicht Enter.

👉 *Erweiterte Befehle* (Hot/Safe)
*/transactions*: Transaktionsliste
*/link*: Hot mit Bluewallet oder Zeus verknuepfen
*/lnurl*: Lnurl empfangen oder bezahlen (Hot): `/lnurl` oder `/lnurl <lnurl> [Memo]`
*/nostr*: Mit Nostr verbinden: `/nostr` erstes Mal: `/nostr help`
*/pos*: POS vorbereiten (Hot): `/pos`
*/group*: Gruppen-Chat-Funktionen (Hot): `/group`
*/shop*: Shops durchsuchen: `/shop` oder `/shop <Nutzer/shop_id>`
