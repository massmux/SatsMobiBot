*Économie*
_Ceci est une suite de portefeuilles Bitcoin Lightning open source auto-gardés. Il y a 2 soldes : Hot et Safe. La bibliothèque Breez est utilisée. Sauvegardez votre mnémonique après /start._

*Portefeuilles Lightning*
_Votre solde Safe peut être utilisé pour envoyer et recevoir des fonds sur le réseau Lightning de manière auto-gardée, où vous possédez vos clés. Vous pouvez également échanger de Hot vers Safe quand vous voulez. Le solde Hot peut être utilisé pour des pourboires rapides et petits sur Telegram. Sauvegardez immédiatement la phrase de récupération_.

*Open Source*
_Ce Bot est un logiciel libre et open source. Vous pouvez l'exécuter sur votre propre ordinateur et l'utiliser dans votre propre communauté. C'est un outil destiné uniquement à des fins éducatives._

*Telegram*
_Ajoutez ce Bot à votre chat de groupe Telegram pour donner des /pourboires aux publications. Si vous faites du bot un administrateur du groupe, il nettoiera également les commandes pour garder le chat ordonné._

*Conditions d'utilisation*
_Sauvegarde immédiate de vos clés avec la commande /backup, juste après /start. Nous ne pouvons pas aider à récupérer les clés en cas d'utilisation abusive. Ce Bot est en développement bêta et expérimental. Utilisez-le à vos risques et périls. Les échanges sont soumis à des frais d'échange dus à la bibliothèque Breez Nodeless utilisée dans cet outil._

_Les citoyens et résidents des États-Unis et de tout pays sanctionné par la SECO sont interdits d'utiliser ce service. En continuant, vous confirmez et déclarez que vous n'êtes PAS citoyen des États-Unis ou de tout pays sanctionné par la SECO._

À propos des frais d'échange Breez : [Frais Breez](https://sdk-doc-liquid.breez.technology/guide/base_fees.html)
"""

