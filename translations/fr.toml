basicsMessage = """
*Économie*
_Ceci est un portefeuille Bitcoin Lightning opensource self-custodial. Il y a 2 soldes : Hot et Safe. La lib Breez est utilisée. Sauvegardez votre mnémonique après /start._

*Portefeuilles Lightning*
_Votre solde Safe peut être utilisé pour envoyer et recevoir des fonds sur le réseau Lightning de manière self-custodial, où vous possédez vos clés. Vous pouvez également échanger de Hot vers Safe quand vous voulez. Le solde Hot peut être utilisé pour des pourboires rapides et petits sur Telegram. Sauvegardez immédiatement la phrase seed._

*Open Source*
_Ce Bot est un logiciel libre et opensource. Vous pouvez l'exécuter sur votre propre ordinateur et l'utiliser dans votre communauté. C'est un outil destiné uniquement à des fins éducatives._

*Telegram*
_Ajoutez ce Bot à votre chat de groupe Telegram pour faire /tip aux messages. Si vous rendez le bot admin du groupe, il nettoiera également les commandes pour garder le chat bien rangé._

*Conditions d'utilisation*
_Sauvegardez immédiatement vos clés avec la commande /backup, juste après /start. Nous ne pouvons pas aider à récupérer les clés en cas de mauvaise utilisation. Ce Bot est en développement bêta et expérimental. Utilisez-le à vos risques et périls. Les swaps sont soumis à des frais en raison de la bibliothèque Breez Nodeless utilisée dans cet outil._

_Les citoyens et résidents des États-Unis et de tout pays sanctionné par la SECO sont interdits d'utiliser ce service. En continuant, vous confirmez et déclarez que vous n'êtes PAS citoyen des États-Unis ou de tout pays sanctionné par la SECO._

À propos des frais de swap Breez : [Frais Breez](https://sdk-doc-liquid.breez.technology/guide/base_fees.html)
"""

