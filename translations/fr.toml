# HELP

helpMessage = """⚡️ *SatsMobi*
_Ceci est un portefeuille Bitcoin Lightning opensource self-custodial. Il y a 2 soldes : Hot et Safe. La bibliothèque Breez est utilisée. Sauvegardez votre mnémonique après /start. Utilisez /basics pour les CGU._

👉 *Commandes de base* (Hot/Safe)
*/tip*: Répondez à un message pour donner un pourboire (Hot) : `/tip <montant> [<mémo>]`
*/balance*: Vérifiez votre solde (Hot|Safe) : `/balance`
*/send*: Envoyez des sats à un utilisateur (Hot) : `/send <montant> @utilisateur ou utilisateur@sats.mobi [<mémo>]`
*/invoice*: Recevoir (Safe) : `/invoice <montant> [<mémo>]`
*/pay*: Payer une facture (Safe) : `/pay <facture>`
*/rate*: Vérifier les taux de change : `/rate [montant] [devise]` - Exemple : `/rate 10000 USD`
*/cashback*: QRCODE pour recevoir un cashback.
*/activatecard*: Demander l'activation d'une NFC Card SatsMobi `/activatecard <CardID>`

👉 *Commandes inline*
*send*: Envoyer des sats dans un chat : `@%s send <montant> [<utilisateur>] [<mémo>]`
*receive*: Demander un paiement : `... receive <montant> [<utilisateur>] [<mémo>]`
*faucet*: Créer un faucet : `... faucet <capacité> <par_utilisateur> [<mémo>]`
*tipjar*: Créer un tipjar : `... tipjar <capacité> <par_utilisateur> [<mémo>]`

📖 Vous pouvez utiliser les commandes inline dans n'importe quel chat, même dans les conversations privées. Attendez une seconde après avoir entré une commande inline et *cliquez* sur le résultat, n'appuyez pas sur Entrée.

👉 *Commandes avancées* (Hot/Safe)
*/transactions*: Liste des transactions
*/link*: Lier Hot à Bluewallet ou Zeus
*/lnurl*: Lnurl recevoir ou payer (Hot) : `/lnurl` ou `/lnurl <lnurl> [mémo]`
*/nostr*: Se connecter à Nostr : `/nostr` première fois : `/nostr help`
*/pos*: Préparez votre POS (Hot) : `/pos`
*/group*: Fonctionnalités de chat de groupe (Hot) : `/group`
*/shop*: Parcourir les boutiques : `/shop` ou `/shop <utilisateur/shop_id>`
*/backup*: Sauvegarder votre Seed Safe : `/backup`
*/buybtc*: Acheter des Bitcoins avec Moonpay : `/buybtc`
*/swaptosafe*: Transférer TOUS les fonds de Hot vers Safe : `/swaptosafe`
*/swapall*: Alias pour tout transférer de Hot vers Safe : `/swapall`
*/swaptohot*: Recharger Hot depuis Safe jusqu'à la limite : `/swaptohot`
*/help*: Lire cette aide.
"""
