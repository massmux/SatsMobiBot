# AIDE

helpMessage = """⚡️ *SatsMobi*
_Ceci est une suite de portefeuilles Bitcoin Lightning open source auto-gardés. Il y a 2 soldes : Hot et Safe. La bibliothèque Breez est utilisée. Sauvegardez d'abord votre mnémonique après /start. Tapez /bases pour les CGU._

👉 *Commandes de base* (Hot/Safe)
*/pourboire* : Répondez à un message pour donner un pourboire (Hot) : `/pourboire <montant> [<note>]`
*/solde* : Vérifiez votre solde (Hot|Safe) : `/solde`
*/envoyer* : Envoyez des pourboires à un utilisateur (Hot) : `/envoyer <montant> @utilisateur ou utilisateur@sats.mobi [<note>]`
*/facture* : Recevoir (Safe) : `/facture <montant> [<note>]`
*/payer* : Payer une facture (Safe) : `/payer <facture>`
*/rate* : Vérifier les taux de change : `/rate [montant] [devise]` - Exemple : `/rate 10000 USD`
*/cashback* : CODE QR pour recevoir un cashback.
*/activatecard* : Demander l'activation d'une carte NFC SatsMobi `/activatecard <CardID>`

👉 *Commandes inline*
*envoyer* : Envoyer des sats au chat : `@%s envoyer <montant> [<utilisateur>] [<note>]`
*recevoir* : Demander un paiement : `... recevoir <montant> [<utilisateur>] [<note>]`
*robinet* : Créer un robinet : `... robinet <capacité> <par_utilisateur> [<note>]`
*tirelire* : Créer une tirelire : `... tirelire <capacité> <par_utilisateur> [<note>]`

📖 Vous pouvez utiliser les commandes inline dans tous les chats, même dans les conversations privées. Attendez une seconde après avoir entré une commande inline et *cliquez* sur le résultat, n'appuyez pas sur entrée.

👉 *Commandes avancées* (Hot/Safe)
*/transactions* : Liste des transactions
*/lier* : Lier Hot à Bluewallet ou Zeus
*/lnurl* : Recevoir ou payer avec Lnurl (Hot) : `/lnurl` ou `/lnurl <lnurl> [note]`
*/nostr* : Se connecter à Nostr : `/nostr` première fois : `/nostr aide`
*/pos* : Préparez votre POS (Hot) : `/pos`
*/group* : Fonctionnalités de chat de groupe (Hot) : `/group`
*/shop* : Parcourir les boutiques : `/shop` ou `/shop <utilisateur/shop_id>`
*/backup* : Sauvegarder votre phrase de récupération Safe : `/backup`
*/buybtc* : Acheter du Bitcoin avec Moonpay : `/buybtc`
*/swaptosafe* : Échanger TOUS les fonds de Hot vers Safe : `/swaptosafe`
*/swapall* : Alias pour échanger tout de Hot vers Safe : `/swapall`
*/swaptohot* : Remplir Hot avec Safe jusqu'à la limite : `/swaptohot`
*/aide* : Lire cette aide.
